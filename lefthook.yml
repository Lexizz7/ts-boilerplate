pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,json,jsonc}"
      run: pnpm format {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{ts,tsx,js,jsx,json,jsonc}"
      run: pnpm lint {staged_files}
      stage_fixed: true
    typecheck:
      glob: "*.{ts,tsx}"
      run: pnpm typecheck
